# Defines all containers used by the Misa project.
services:

  # -------------------------------------------------------
  # Python / Flask application
  # -------------------------------------------------------
  misa:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: misa-app

    ports:
      # Ubuntu port 8000 → Flask container port 8000.
      - "8000:8000"

    volumes:
      # Bind the project into the container.
      - type: bind
        source: .
        target: /app

    working_dir: /app

    command:
      - python
      - app.py

    environment:
      # Ollama connection used by Misa's chat.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:1.7b

      # Local Qdrant vector database.
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"

      # Document RAG configuration.
      RAG_EMBED_MODEL: embeddinggemma
      RAG_COLLECTION: misa_knowledge

      # Mem0 long-term personal memory configuration.
      MEM0_TELEMETRY: "false"
      MEM0_LLM_MODEL: qwen3:1.7b
      MEM0_EMBED_MODEL: embeddinggemma
      MEM0_COLLECTION: misa_personal_memories
      MEM0_USER_ID: sonu

      # Local speech-to-text services.
      KANNADA_STT_URL: http://kannada-stt:9001
      ENGLISH_STT_URL: http://english-stt:9002/inference

    depends_on:
      ollama:
        condition: service_healthy

      model-pull:
        condition: service_completed_successfully

      embedding-pull:
        condition: service_completed_successfully

      qdrant:
        condition: service_started

      kannada-stt:
        condition: service_healthy

      english-stt:
        condition: service_healthy

    restart: unless-stopped


  # -------------------------------------------------------
  # Kannada speech-to-text
  # -------------------------------------------------------
  kannada-stt:
    build:
      context: ./voice/indic
      dockerfile: Dockerfile

    image: misa-indic-asr:cpu

    container_name: misa-indic-asr

    environment:
      INDIC_MODEL_PATH: /model
      INDIC_LANGUAGE: kn
      INDIC_DECODER: ctc
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    ports:
      # Local debugging access.
      - "127.0.0.1:9001:9001"

    volumes:
      - type: bind
        source: ./voice/models/indic-conformer-600m-multilingual
        target: /model
        read_only: true

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9001/health', timeout=5)"

      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped


  # -------------------------------------------------------
  # English speech-to-text
  # -------------------------------------------------------
  english-stt:
    build:
      context: ./voice
      dockerfile: Dockerfile

    image: misa-whisper:cuda12.8

    container_name: misa-whisper-stt

    # Give Whisper access to the NVIDIA GPU.
    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    ports:
      # Local debugging access.
      - "127.0.0.1:9002:9002"

    volumes:
      - type: bind
        source: ./voice/models
        target: /models
        read_only: true

    healthcheck:
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9002'"

      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped


  # -------------------------------------------------------
  # Ollama local AI server
  # -------------------------------------------------------
  ollama:
    image: ollama/ollama:latest

    container_name: misa-ollama

    # Give Ollama access to the NVIDIA GPU.
    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    ports:
      # Ubuntu port 11434 → Ollama port 11434.
      - "11434:11434"

    volumes:
      # Persist downloaded Ollama models.
      - type: volume
        source: ollama_models
        target: /root/.ollama

    healthcheck:
      # Ollama is healthy when it can list models.
      test:
        - CMD
        - ollama
        - list

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    restart: unless-stopped


  # -------------------------------------------------------
  # Downloads Misa's conversational model
  # -------------------------------------------------------
  model-pull:
    image: ollama/ollama:latest

    container_name: misa-model-pull

    environment:
      OLLAMA_HOST: http://ollama:11434

    command:
      - pull
      - qwen3:1.7b

    depends_on:
      ollama:
        condition: service_healthy

    restart: "no"


  # -------------------------------------------------------
  # Downloads the local RAG embedding model
  # -------------------------------------------------------
  embedding-pull:
    image: ollama/ollama:latest

    container_name: misa-embedding-pull

    environment:
      OLLAMA_HOST: http://ollama:11434

    command:
      - pull
      - embeddinggemma

    depends_on:
      ollama:
        condition: service_healthy

    restart: "no"


  # -------------------------------------------------------
  # Qdrant local vector database
  # -------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest

    container_name: misa-qdrant

    ports:
      # Restrict the Qdrant dashboard/API to this laptop.
      - "127.0.0.1:6333:6333"

    volumes:
      # Persist document embeddings and metadata.
      - type: volume
        source: qdrant_data
        target: /qdrant/storage

    restart: unless-stopped


# ---------------------------------------------------------
# Persistent Docker volumes
# ---------------------------------------------------------
volumes:

  # Keeps Ollama models across container recreation.
  ollama_models:
    name: misa_ollama_models

  # Keeps RAG and Mem0 Qdrant collections across recreation.
  qdrant_data:
    name: misa_qdrant_data