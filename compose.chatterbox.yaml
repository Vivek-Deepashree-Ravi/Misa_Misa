services:

  chatterbox-tts:
    build:
      context: ./voice/chatterbox
      dockerfile: Dockerfile

    image: misa-chatterbox-nano:cpu
    container_name: misa-chatterbox-nano

    environment:
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      TORCH_THREADS: "16"
      OMP_NUM_THREADS: "16"
      MKL_NUM_THREADS: "16"
      MAX_TEXT_LENGTH: "1000"

    ports:
      - "127.0.0.1:9005:9005"

    volumes:
      - type: volume
        source: chatterbox_cache
        target: /cache

    shm_size: 1gb

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9005/health', timeout=5)"

      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 10m

    restart: unless-stopped


volumes:

  chatterbox_cache:
    name: misa_chatterbox_cache
