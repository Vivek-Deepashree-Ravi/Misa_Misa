<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Misa-Misa AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>
    <main class="app">

        <!-- Character image -->
        <section class="character">
            <img
                class="character-image"
                src="{{ url_for('static', filename='images/misa.jpeg') }}"
                alt="Misa-Misa"
            >

            <div class="character-shade"></div>

            <div class="character-information">
                <h1>Misa-Misa</h1>

                <p class="status">
                    <span class="online-dot"></span>

                    <span id="connection-status">
                        Connecting...
                    </span>
                </p>
            </div>
        </section>

        <!-- Conversation area -->
        <section
            id="chat"
            class="chat"
            aria-live="polite"
            aria-label="Conversation with Misa-Misa"
        ></section>

        <!-- Message input -->
        <form id="composer" class="composer">
            <input
                id="message"
                type="text"
                placeholder="Message Misa-Misa..."
                autocomplete="off"
                aria-label="Message"
            >

            <button
                id="send"
                type="submit"
                disabled
            >
                Connect...
            </button>
        </form>
    </main>

    <script>
        const chat =
            document.getElementById("chat");

        const composer =
            document.getElementById("composer");

        const messageInput =
            document.getElementById("message");

        const sendButton =
            document.getElementById("send");

        const connectionStatus =
            document.getElementById("connection-status");


        let socket = null;
        let activeMisaBubble = null;
        let isGenerating = false;
        let reconnectTimer = null;


        /**
         * Add one message to the conversation.
         */
        function addMessage(sender, text) {
            const messageElement =
                document.createElement("article");

            const avatarElement =
                document.createElement("div");

            const contentElement =
                document.createElement("div");

            const nameElement =
                document.createElement("span");

            const bubbleElement =
                document.createElement("div");


            messageElement.className =
                `message ${sender}`;

            avatarElement.className =
                "message-avatar";

            avatarElement.textContent =
                sender === "misa" ? "M" : "S";

            contentElement.className =
                "message-content";

            nameElement.className =
                "message-name";

            nameElement.textContent =
                sender === "misa"
                    ? "Misa-Misa"
                    : "Sonu";

            bubbleElement.className =
                "bubble";

            /*
             * textContent prevents chat messages
             * from injecting HTML.
             */
            bubbleElement.textContent = text;

            contentElement.appendChild(
                nameElement
            );

            contentElement.appendChild(
                bubbleElement
            );

            messageElement.appendChild(
                avatarElement
            );

            messageElement.appendChild(
                contentElement
            );

            chat.appendChild(
                messageElement
            );

            chat.scrollTop =
                chat.scrollHeight;

            return bubbleElement;
        }


        /**
         * Enable or disable the composer.
         */
        function setLoading(loading) {
            isGenerating = loading;

            messageInput.disabled = loading;

            const connected =
                socket &&
                socket.readyState === WebSocket.OPEN;

            sendButton.disabled =
                loading || !connected;

            if (loading) {
                sendButton.textContent = "Wait...";
            } else if (connected) {
                sendButton.textContent = "Send";
            } else {
                sendButton.textContent = "Connect...";
            }
        }


        /**
         * Create the correct WebSocket URL.
         */
        function websocketUrl() {
            const protocol =
                window.location.protocol === "https:"
                    ? "wss:"
                    : "ws:";

            return (
                `${protocol}//` +
                `${window.location.host}/ws/chat`
            );
        }


        /**
         * Connect the browser to Flask.
         */
        function connectSocket() {
            if (
                socket &&
                (
                    socket.readyState === WebSocket.OPEN ||
                    socket.readyState === WebSocket.CONNECTING
                )
            ) {
                return;
            }

            connectionStatus.textContent =
                "Connecting...";

            sendButton.disabled = true;
            sendButton.textContent = "Connect...";

            socket =
                new WebSocket(websocketUrl());


            socket.addEventListener(
                "open",
                function () {
                    console.log(
                        "Misa WebSocket connected"
                    );

                    connectionStatus.textContent =
                        "Online · Real-time";

                    if (!isGenerating) {
                        messageInput.disabled = false;
                        sendButton.disabled = false;
                        sendButton.textContent = "Send";
                        messageInput.focus();
                    }
                }
            );


            socket.addEventListener(
                "message",
                function (event) {
                    let data;

                    try {
                        data = JSON.parse(event.data);
                    } catch (error) {
                        console.error(
                            "Invalid WebSocket response:",
                            event.data
                        );

                        return;
                    }


                    /*
                     * Append each streamed fragment
                     * to Misa's message bubble.
                     */
                    if (data.type === "delta") {
                        if (!activeMisaBubble) {
                            activeMisaBubble =
                                addMessage("misa", "");
                        }

                        /*
                         * Remove the thinking message when
                         * the first real fragment arrives.
                         */
                        if (
                            activeMisaBubble.dataset.waiting
                            === "true"
                        ) {
                            activeMisaBubble.textContent = "";

                            activeMisaBubble.dataset.waiting =
                                "false";
                        }

                        activeMisaBubble.textContent +=
                            data.text || "";

                        chat.scrollTop =
                            chat.scrollHeight;

                        return;
                    }


                    /*
                     * The complete response has finished.
                     */
                    if (data.type === "done") {
                        if (activeMisaBubble) {
                            const stillWaiting =
                                activeMisaBubble.dataset.waiting
                                === "true";

                            if (stillWaiting) {
                                activeMisaBubble.textContent =
                                    data.reply ||
                                    "I couldn't create a reply.";

                                activeMisaBubble.dataset.waiting =
                                    "false";
                            }
                        } else if (data.reply) {
                            addMessage(
                                "misa",
                                data.reply
                            );
                        }

                        activeMisaBubble = null;

                        setLoading(false);
                        messageInput.focus();

                        return;
                    }


                    /*
                     * Display backend errors.
                     */
                    if (data.type === "error") {
                        const errorMessage =
                            data.error ||
                            "Misa encountered an error.";

                        if (activeMisaBubble) {
                            activeMisaBubble.textContent =
                                errorMessage;

                            activeMisaBubble.dataset.waiting =
                                "false";
                        } else {
                            addMessage(
                                "misa",
                                errorMessage
                            );
                        }

                        activeMisaBubble = null;

                        setLoading(false);
                        messageInput.focus();
                    }
                }
            );


            socket.addEventListener(
                "close",
                function () {
                    console.log(
                        "Misa WebSocket disconnected"
                    );

                    connectionStatus.textContent =
                        "Reconnecting...";

                    if (
                        isGenerating &&
                        activeMisaBubble
                    ) {
                        activeMisaBubble.textContent =
                            "The connection closed before " +
                            "Misa finished responding.";

                        activeMisaBubble.dataset.waiting =
                            "false";
                    }

                    activeMisaBubble = null;
                    setLoading(false);

                    clearTimeout(reconnectTimer);

                    reconnectTimer = setTimeout(
                        connectSocket,
                        1500
                    );
                }
            );


            socket.addEventListener(
                "error",
                function (error) {
                    console.error(
                        "WebSocket error:",
                        error
                    );

                    connectionStatus.textContent =
                        "Connection error";
                }
            );
        }


        /**
         * Send one message to Misa.
         */
        function sendMessage() {
            const text =
                messageInput.value.trim();

            if (!text || isGenerating) {
                return;
            }

            if (
                !socket ||
                socket.readyState !== WebSocket.OPEN
            ) {
                connectSocket();

                addMessage(
                    "misa",
                    "The real-time connection is starting. " +
                    "Please try again in a moment."
                );

                return;
            }

            addMessage(
                "user",
                text
            );

            /*
             * Display a placeholder while waiting
             * for Ollama's first token.
             */
            activeMisaBubble = addMessage(
                "misa",
                "Misa-Misa is thinking..."
            );

            activeMisaBubble.dataset.waiting =
                "true";

            messageInput.value = "";

            setLoading(true);

            socket.send(JSON.stringify({
                message: text
            }));
        }


        composer.addEventListener(
            "submit",
            function (event) {
                event.preventDefault();
                sendMessage();
            }
        );


        /**
         * Close the WebSocket when leaving the page.
         */
        window.addEventListener(
            "beforeunload",
            function () {
                clearTimeout(reconnectTimer);

                if (socket) {
                    socket.close();
                }
            }
        );


        /*
         * Start the connection.
         * No fixed greeting is added.
         */
        connectSocket();
    </script>
</body>
</html>
